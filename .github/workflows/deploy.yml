name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Public values, stored as repository *variables* (Settings → Secrets and variables → Actions → Variables)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PRICE_LABEL: ${{ vars.VITE_PRICE_LABEL }}
          # Search engines: public address of the site (custom domain) and Google Search Console code
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
          # Served at the root of the custom domain (magicianhelper.com). Without a custom domain,
          # set the variable to "/<repo>/" (site at https://<owner>.github.io/<repo>/)
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
